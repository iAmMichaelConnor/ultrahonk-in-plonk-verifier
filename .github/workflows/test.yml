name: PLONK tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      extended:
        description: Run the full verifier regression suite
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      extended:
        description: Run the full verifier regression suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run quick tests
        if: ${{ !inputs.extended }}
        timeout-minutes: 10
        run: make test-short
      - name: Run full verifier and adversarial regressions
        if: ${{ inputs.extended }}
        run: make test-ci
